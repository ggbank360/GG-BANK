<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GG BANK - Inter-Account Transfer Surveillance">
  <title>Transfer Management - GG BANK Admin</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar admin-sidebar" id="adminSidebar"></aside>

    <div class="main-wrapper">
      <header class="topbar"></header>

      <main class="content-area">
        <div class="page-header">
          <div>
            <div style="font-size: 0.8rem; color: var(--accent-cyan); font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">
              Admin Portal &bull; Transfer Management
            </div>
            <h2 class="page-title"><i class="fa-solid fa-right-left"></i> Transfer <span>Surveillance & Flow</span></h2>
            <p class="page-description">Surveillance and verification of peer-to-peer and interbank funds transfers.</p>
          </div>
          <button class="btn btn-secondary" onclick="exportTransfersCsv()">
            <i class="fa-solid fa-file-csv"></i> Export Transfers
          </button>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="card" style="margin-bottom: 24px;">
          <div class="filter-toolbar" style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center;">
            <div class="search-box" style="flex: 1; min-width: 280px;">
              <input type="text" class="form-control" id="transferSearchInput" placeholder="🔍 Search Transfer ID, sender account, receiver account...">
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
              <select id="transferDateFilter" class="form-control" style="width: 140px;">
                <option value="ALL">All Time</option>
                <option value="TODAY">Today</option>
                <option value="WEEK">This Week</option>
                <option value="MONTH">This Month</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Transfer Table Card -->
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Transfer ID</th>
                  <th>Sender Account</th>
                  <th>Receiver Account</th>
                  <th>Transfer Amount</th>
                  <th>Date & Time</th>
                  <th>Balance After</th>
                  <th>Status</th>
                  <th style="text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody id="adminTransferTableBody">
                <!-- Dynamic Rows -->
              </tbody>
            </table>
          </div>

          <!-- Pagination Footer -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-color-subtle);">
            <div style="font-size: 0.85rem; color: var(--text-secondary);" id="transferCountSummary">
              Showing 0 transfers
            </div>
            <div style="display: flex; gap: 8px;" id="transferPaginationBtns">
              <!-- Pagination buttons -->
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Transfer Details Modal -->
  <div class="modal-backdrop" id="transferDetailsModal">
    <div class="modal-card" style="max-width: 480px;">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fa-solid fa-receipt" style="color: var(--accent-cyan);"></i> Wire Transfer Receipt</h3>
        <button class="modal-close-btn" onclick="document.getElementById('transferDetailsModal').classList.remove('active')">&times;</button>
      </div>
      <div id="transferModalBody" style="padding: 16px 0; display: flex; flex-direction: column; gap: 12px; font-size: 0.9rem;">
        <!-- Filled dynamically -->
      </div>
      <div class="modal-footer" style="display: flex; justify-content: flex-end; padding-top: 12px; border-top: 1px solid var(--border-color-subtle);">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('transferDetailsModal').classList.remove('active')">Close</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/admin-transfers.js"></script>
</body>
</html>
