<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GG BANK - Immutable Security Audit Logs">
  <title>Audit Logs - GG BANK Admin</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar admin-sidebar" id="adminSidebar"></aside>

    <div class="main-wrapper">
      <header class="topbar"></header>

      <main class="content-area">
        <div class="page-header">
          <div>
            <div style="font-size: 0.8rem; color: var(--accent-cyan); font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">
              Admin Portal &bull; System Audit Trail
            </div>
            <h2 class="page-title"><i class="fa-solid fa-shield-halved"></i> Immutable <span>Audit Trail & Logs</span></h2>
            <p class="page-description">Tamper-proof compliance records of all administrator actions, status changes, logins, and approvals.</p>
          </div>
          <button class="btn btn-secondary" onclick="exportAuditCsv()">
            <i class="fa-solid fa-file-csv"></i> Export Audit Logs
          </button>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="card" style="margin-bottom: 24px;">
          <div class="filter-toolbar" style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center;">
            <div class="search-box" style="flex: 1; min-width: 280px;">
              <input type="text" class="form-control" id="auditSearchInput" placeholder="🔍 Search Log ID, actor ID, description...">
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
              <label style="font-size: 0.85rem; color: var(--text-secondary);">Action Filter:</label>
              <select id="auditActionFilter" class="form-control" style="width: 180px;">
                <option value="ALL">All Actions</option>
                <option value="ADMIN_LOGIN">Admin Login</option>
                <option value="ACCOUNT_STATUS_CHANGE">Status Change</option>
                <option value="CUSTOMER_STATUS_CHANGE">Customer Status</option>
                <option value="LOAN_APPROVED">Loan Approved</option>
                <option value="LOAN_REJECTED">Loan Rejected</option>
                <option value="ADMIN_DEPOSIT">Admin Deposit</option>
                <option value="CUSTOMER_EDIT">Customer Edit</option>
                <option value="SYSTEM_SETTINGS_UPDATE">Settings Update</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Audit Table Card -->
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Log ID</th>
                  <th>Timestamp</th>
                  <th>Actor / Admin ID</th>
                  <th>Action Type</th>
                  <th>Audit Description</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="adminAuditTableBody">
                <!-- Dynamic Rows -->
              </tbody>
            </table>
          </div>

          <!-- Pagination Footer -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-color-subtle);">
            <div style="font-size: 0.85rem; color: var(--text-secondary);" id="auditCountSummary">
              Showing 0 audit logs
            </div>
            <div style="display: flex; gap: 8px;" id="auditPaginationBtns">
              <!-- Pagination controls -->
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/audit-logs.js"></script>
</body>
</html>
