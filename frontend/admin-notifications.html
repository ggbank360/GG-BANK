<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GG BANK - System Alerts & Administrative Notifications">
  <title>System Notifications - GG BANK Admin</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar admin-sidebar" id="adminSidebar"></aside>

    <div class="main-wrapper">
      <header class="topbar"></header>

      <main class="content-area">
        <div class="page-header">
          <div>
            <div style="font-size: 0.8rem; color: var(--accent-cyan); font-weight: 600; text-transform: uppercase; margin-bottom: 4px;">
              Admin Portal &bull; System Alerts
            </div>
            <h2 class="page-title"><i class="fa-solid fa-bell"></i> Administrative <span>Notifications & Alerts</span></h2>
            <p class="page-description">Real-time alerts for customer registrations, high-value transfers, and loan applications.</p>
          </div>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary btn-sm" onclick="markAllNotificationsRead()">
              <i class="fa-solid fa-check-double"></i> Mark All as Read
            </button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="card" style="margin-bottom: 24px;">
          <div class="filter-toolbar" style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-primary btn-sm notif-filter-btn active" data-filter="ALL" onclick="setNotifFilter('ALL', this)">All</button>
              <button class="btn btn-secondary btn-sm notif-filter-btn" data-filter="UNREAD" onclick="setNotifFilter('UNREAD', this)">Unread</button>
              <button class="btn btn-secondary btn-sm notif-filter-btn" data-filter="READ" onclick="setNotifFilter('READ', this)">Read</button>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-secondary);" id="notifUnreadCounter">
              0 unread alerts
            </div>
          </div>
        </div>

        <!-- Notification List Feed -->
        <div id="adminNotifsFeedContainer" style="display: flex; flex-direction: column; gap: 14px; max-width: 960px;">
          <!-- Rendered dynamically -->
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/admin-notifications.js"></script>
</body>
</html>
