# GG BANK - Spring Boot Configuration
server.port=8080
server.servlet.context-path=/

# Application Branding & Metadata
app.name=GG BANK
app.tagline=Secure Banking. Smarter Future.
app.default.ifsc=GGBN0001234
app.default.branch=Central Tech Branch

# Firebase Configuration
firebase.config.path=serviceAccountKey.json
firebase.project.id=gg-bank-fc100
firebase.database.url=https://gg-bank-fc100-default-rtdb.asia-southeast1.firebasedatabase.app
firebase.storage.bucket=gg-bank-fc100.firebasestorage.app

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.ggbank=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
