# GG BANK - Spring Boot Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Branding & Metadata
app.name=GG BANK
app.tagline=Secure Banking. Smarter Future.
app.default.ifsc=GGBN0001234
app.default.branch=Central Tech Branch

# CORS Configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://ggbank.vercel.app,http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://127.0.0.1:3000,http://localhost:8080}

# Firebase Configuration
firebase.config.path=${FIREBASE_CONFIG_PATH:serviceAccountKey.json}
firebase.project.id=${FIREBASE_PROJECT_ID:gg-bank-fc100}
firebase.database.url=${FIREBASE_DATABASE_URL:https://gg-bank-fc100-default-rtdb.asia-southeast1.firebasedatabase.app}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:gg-bank-fc100.firebasestorage.app}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.ggbank=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
